[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amorphous-periodic-table"
version = "1.0.0"
description = "Literature retrieval, IUPAC stoichiometric normalization, SQLite ingestion, and statistical/tetrahedral attribution across the Amorphous Periodic Table."
readme = "amorphous_periodic_table_report.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
